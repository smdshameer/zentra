name: CI

on:
  push:
    branches:
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: ESLint
        run: pnpm exec eslint . --ext .ts,.tsx

  test:
    name: Test Suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zentra_test_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Provision disposable test database
        run: |
          if command -v psql >/dev/null 2>&1; then
            echo "Provisioning zentra_test_disposable via psql..."
            PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'zentra_test_disposable'" | grep -q 1 || PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE zentra_test_disposable;"
            PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'zentra_test'" | grep -q 1 || PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE zentra_test;"
          else
            echo "psql not found; provisioning databases via node..."
            node -e "
              const { Client } = require('./apps/api/node_modules/pg');
              const client = new Client({ connectionString: 'postgresql://postgres:postgres@localhost:5432/postgres' });
              async function main() {
                await client.connect();
                for (const db of ['zentra_test_disposable', 'zentra_test']) {
                  const res = await client.query(\"SELECT 1 FROM pg_database WHERE datname = '\" + db + \"'\");
                  if (res.rowCount === 0) {
                    await client.query('CREATE DATABASE ' + db);
                    console.log('Created database ' + db);
                  } else {
                    console.log('Database ' + db + ' already exists');
                  }
                }
                await client.end();
              }
              main().catch(err => { console.error(err); process.exit(1); });
            "
          fi

      - name: Verify disposable test database identity
        run: |
          if command -v psql >/dev/null 2>&1; then
            echo "Verifying live connection to zentra_test_disposable via psql..."
            PGPASSWORD=postgres psql -h localhost -U postgres -d zentra_test_disposable -c "SELECT current_database();"
          else
            node -e "
              const { Client } = require('./apps/api/node_modules/pg');
              const client = new Client({ connectionString: 'postgresql://postgres:postgres@localhost:5432/zentra_test_disposable' });
              async function main() {
                await client.connect();
                const res = await client.query('SELECT current_database() AS db');
                console.log('Verified connected database:', res.rows[0].db);
                if (res.rows[0].db !== 'zentra_test_disposable') {
                  throw new Error('Database identity mismatch: expected zentra_test_disposable, got ' + res.rows[0].db);
                }
                await client.end();
              }
              main().catch(err => { console.error(err); process.exit(1); });
            "
          fi

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test
          APP_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zentra_test_disposable
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zentra_test_disposable
          TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/zentra_test_disposable
          JWT_ACCESS_SECRET: zentra-ci-test-access-secret-32chars-min!
          JWT_REFRESH_SECRET: zentra-ci-test-refresh-secret-32chars-min!
          OFFLINE_PERMIT_SIGNING_KEY: zentra-ci-test-permit-key-32chars-min!

  container-verify:
    name: Container Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build local Docker image
        run: |
          echo "Building local Docker image zentra-api:ci-test..."
          docker build -t zentra-api:ci-test .

      - name: Verify non-root container user
        run: |
          CONTAINER_USER=$(docker run --rm zentra-api:ci-test whoami)
          CONTAINER_UID=$(docker run --rm zentra-api:ci-test id -u)
          echo "Container user: $CONTAINER_USER (UID: $CONTAINER_UID)"
          if [ "$CONTAINER_USER" != "node" ]; then
            echo "Security Error: Container is not configured to execute as non-root user 'node'"
            exit 1
          fi
          if [ "$CONTAINER_UID" != "1000" ]; then
            echo "Security Error: Container UID is $CONTAINER_UID, expected 1000"
            exit 1
          fi

      - name: Verify fail-closed startup behavior without mandatory configuration
        run: |
          echo "Testing fail-closed termination when required production configuration is omitted..."
          set +e
          docker run --rm \
            -e NODE_ENV=production \
            -e APP_ENV=production \
            zentra-api:ci-test
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "Security Error: Container unexpectedly started without required production secrets!"
            exit 1
          fi
          echo "Verified: Container correctly aborted fail-closed on missing configuration (exit code $EXIT_CODE)"

      - name: Setup disposable PostgreSQL and test container
        run: |
          echo "Creating isolated Docker bridge network..."
          docker network create zentra-ci-net

          echo "Starting disposable PostgreSQL container..."
          docker run -d \
            --name zentra-ci-postgres \
            --network zentra-ci-net \
            --network-alias postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=zentra_test_disposable \
            postgres:16-alpine

          echo "Waiting for disposable PostgreSQL container to be ready..."
          for i in $(seq 1 30); do
            if docker exec zentra-ci-postgres pg_isready -U postgres -d zentra_test_disposable; then
              echo "PostgreSQL is ready!"
              break
            fi
            sleep 1
          done

          echo "Starting API container with synthetic disposable test configuration..."
          docker run -d \
            --name zentra-api-test \
            --network zentra-ci-net \
            -p 4000:4000 \
            -e NODE_ENV=production \
            -e APP_ENV=production \
            -e API_PORT=4000 \
            -e API_HOST=0.0.0.0 \
            -e DATABASE_URL=postgresql://postgres:postgres@postgres:5432/zentra_test_disposable \
            -e JWT_ACCESS_SECRET=zentra-ci-test-access-secret-32chars-min! \
            -e JWT_REFRESH_SECRET=zentra-ci-test-refresh-secret-32chars-min! \
            -e OFFLINE_PERMIT_SIGNING_KEY=zentra-ci-test-permit-key-32chars-min! \
            -e S3_BUCKET_NAME=zentra-ci-test-evidence-vault \
            -e S3_REGION=ap-south-1 \
            -e S3_ACCESS_KEY=zentra-ci-test-access-key-id \
            -e S3_SECRET_KEY=zentra-ci-test-secret-access-key-min40chars \
            zentra-api:ci-test

      - name: Verify container health endpoints
        run: |
          echo "Waiting for API container liveness probe..."
          for i in $(seq 1 30); do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/v1/health/liveness || true)
            if [ "$STATUS_CODE" -eq 200 ]; then
              echo "Liveness probe reached HTTP 200!"
              break
            fi
            sleep 1
          done

          echo "Checking /api/v1/health/liveness response body..."
          LIVENESS_RESP=$(curl -s http://localhost:4000/api/v1/health/liveness)
          echo "Liveness response: $LIVENESS_RESP"
          echo "$LIVENESS_RESP" | grep -q '"status":"ok"' || (echo "Liveness status verification failed"; exit 1)

          echo "Checking /api/v1/health/readiness response body..."
          READINESS_RESP=$(curl -s http://localhost:4000/api/v1/health/readiness)
          echo "Readiness response: $READINESS_RESP"
          echo "$READINESS_RESP" | grep -q '"status":"ok"' || (echo "Readiness status verification failed"; exit 1)
          echo "$READINESS_RESP" | grep -q '"database":{"status":"ok"}' || (echo "Readiness database check failed"; exit 1)

      - name: Verify Docker native healthcheck status
        run: |
          echo "Waiting for Docker native healthcheck status to become healthy..."
          for i in $(seq 1 45); do
            HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' zentra-api-test 2>/dev/null || true)
            echo "Current Docker health status: $HEALTH_STATUS"
            if [ "$HEALTH_STATUS" = "healthy" ]; then
              echo "Docker reported container is healthy!"
              break
            fi
            sleep 2
          done
          if [ "$HEALTH_STATUS" != "healthy" ]; then
            echo "Error: Docker healthcheck status did not reach healthy (status: $HEALTH_STATUS)"
            docker logs zentra-api-test
            exit 1
          fi

      - name: Teardown and cleanup test containers
        if: always()
        run: |
          echo "Capturing container logs on exit..."
          docker logs zentra-api-test 2>&1 | tail -n 50 || true
          docker stop zentra-api-test zentra-ci-postgres 2>/dev/null || true
          docker rm -f zentra-api-test zentra-ci-postgres 2>/dev/null || true
          docker network rm zentra-ci-net 2>/dev/null || true
          docker rmi zentra-api:ci-test 2>/dev/null || true
          echo "Cleanup complete."

  publish-ghcr:
    name: Publish Container Image to GHCR
    runs-on: ubuntu-latest
    needs: [container-verify]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ghcr.io/${{ github.repository }}/api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build local image for vulnerability scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: zentra-api:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan container image with Trivy (Vulnerability Scan)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: 'zentra-api:scan-target'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Publish production Docker image to GHCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
